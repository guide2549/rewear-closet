<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ReWear Closet</title>
  <style>
    body { font-family: Arial; margin:0; background:#f5f5f5; }
    header { background:#222; color:#fff; padding:15px; text-align:center; }
    .container { padding:20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; }
    .card {
      background:#fff; padding:10px; border-radius:10px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
      text-align:center;
    }
    img { width:100%; border-radius:10px; }
    button {
      background:#ff5c8a; color:#fff; border:none;
      padding:8px 12px; border-radius:5px; cursor:pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>ReWear Closet 👕</h1>
  <p>เสื้อผ้ามือสอง สไตล์เกาหลี ราคาน่ารัก</p>
</header>

<div class="container">
  <h2>สินค้าแนะนำ</h2>

  <div class="grid">

    <div class="card">
      <img src="https://via.placeholder.com/200">
      <h3>เสื้อครอปน่ารัก</h3>
      <p>ราคา: 120 บาท</p>
      <button>ซื้อสินค้า</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/200">
      <h3>เสื้อยืดวินเทจ</h3>
      <p>ราคา: 150 บาท</p>
      <button>ซื้อสินค้า</button>
    </div>

    <div class="card">
      <img src="https://via.placeholder.com/200">
      <h3>กางเกงยีนส์โอเวอร์ไซส์</h3>
      <p>ราคา: 250 บาท</p>
      <button>ซื้อสินค้า</button>
    </div>

  </div>
</div>

</body>
</html>
